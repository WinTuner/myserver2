name: main
on: [push]
jobs:
  job1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: install node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install deps
        run: npm ci
      - name: Build
        run: npm run build
      - name: Unit test
        run: npm run test:unit
      - name: Integration test
        run: npm run test:integration
