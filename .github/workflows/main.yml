name: main
on: [push]
jobs:
  job1:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node
      uses: actions/setup-node@v2
      with:
        node-version: '24'

    - name: Install deps
      run: npm ci

    - name: Build
      run: npm run build

    - name: Run Test1
      run: node dist/Test1.js

    - name: Run API test
      run: npm run test:api
      env:
        MONGODB_URI: ${{ secrets.MONGODB_URI }}
